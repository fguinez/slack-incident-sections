[project]
name = "slack-incident-sections"
version = "0.1.0"
description = "Keep incident.io channels in the right Slack sidebar section"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["slack_incident_sections.py", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
